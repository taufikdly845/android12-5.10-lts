name: Mirror android12-5.10-lts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-android12-5.10-lts
  cancel-in-progress: true

env:
  UPSTREAM_URL: https://android.googlesource.com/kernel/common
  UPSTREAM_BRANCH: android12-5.10-lts

jobs:
  mirror:
    name: Mirror android12-5.10-lts
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Configure Git
        shell: bash
        run: |
          set -euxo pipefail

          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 1048576000
          git config --global core.compression 0
          git config --global pack.threads 2
          git config --global gc.auto 0

      - name: Clone upstream branch
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --bare \
            --branch "${UPSTREAM_BRANCH}" \
            "${UPSTREAM_URL}" \
            kernel.git

      - name: Show upstream information
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel.git

          echo "Branch : ${UPSTREAM_BRANCH}"
          echo "Commit : $(git rev-parse ${UPSTREAM_BRANCH})"

          git log -1 --stat

      - name: Push to GitHub
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euxo pipefail

          cd kernel.git

          git remote remove origin || true

          git remote add github \
            "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"

          for i in {1..5}; do
            echo "Push attempt ${i}"

            if git push github \
              refs/heads/${UPSTREAM_BRANCH}:refs/heads/${UPSTREAM_BRANCH} \
              --force
            then
              echo "Mirror completed successfully."
              exit 0
            fi

            echo "Retry after 30 seconds..."
            sleep 30
          done

          echo "Mirror failed."
          exit 1
